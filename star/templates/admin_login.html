{{ define "content" }}
<div style="min-height: 70vh; display: flex; align-items: center; justify-content: center; padding: 2rem 1rem;">
  <div style="width: 100%; max-width: 420px; background: #FFFFFF; border: 1px solid var(--border-color); border-radius: var(--radius-lg); padding: 2.5rem; box-shadow: var(--shadow-lg);">
    <div style="text-align: center; margin-bottom: 2rem;">
      <div class="brand-icon" style="margin: 0 auto 1rem auto; width: 48px; height: 48px; font-size: 1.5rem;">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 6v12M6 12h12M4 4h16v16H4z"/></svg>
      </div>
      <h2 style="font-size: 1.5rem; font-weight: 800; color: var(--dark-navy);">Admin Portal</h2>
      <p style="color: var(--neutral-muted); font-size: 0.875rem; margin-top: 0.25rem;">Sign in to manage directory data & Excel uploads</p>
    </div>

    {{ if .Error }}
      <div class="alert alert-danger" style="margin-bottom: 1.5rem;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
        <span>{{ .Error }}</span>
      </div>
    {{ end }}

    <form action="/admin/login" method="POST">
      <div class="filter-group">
        <label class="filter-label" for="username">Username</label>
        <input type="text" name="username" id="username" class="filter-input" placeholder="Enter username" required autofocus>
      </div>

      <div class="filter-group">
        <label class="filter-label" for="password">Password</label>
        <input type="password" name="password" id="password" class="filter-input" placeholder="••••••••" required>
      </div>

      <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center; padding: 0.75rem; font-size: 1rem; margin-top: 1rem;">
        Sign In to Portal
      </button>
    </form>
  </div>
</div>
{{ end }}
